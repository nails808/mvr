<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D2D6B" />
    <title>myVicRoads — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #E8ECEE;
        color: #1A2A3A;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #fff;
        border-radius: 16px;
        padding: 28px 24px;
        max-width: 360px;
        border: 1px solid #E8EAED;
        box-shadow: 0 4px 16px rgba(13, 45, 107, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        color: #0D2D6B;
      }
      p {
        margin: 0;
        font-size: 15px;
        color: #6B7C8D;
        line-height: 1.45;
      }
      button {
        margin-top: 20px;
        padding: 12px 24px;
        border: none;
        border-radius: 10px;
        background: #0D2D6B;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        myVicRoads needs a connection for this page. Your saved licence and vehicle details
        remain available when you reopen the app.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>

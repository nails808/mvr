<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- PWA / Android Chrome -->
    <meta name="theme-color" content="#0D2D6B" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0D2D6B" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D2D6B" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="myVicRoads" />

    <!-- iOS Home Screen — standalone / full-screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="myVicRoads" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-touch-fullscreen" content="yes" />

    <!-- Windows / Edge -->
    <meta name="msapplication-TileColor" content="#0D2D6B" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="msapplication-navbutton-color" content="#0D2D6B" />

    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Swanky+and+Moo+Moo&display=swap"
      rel="stylesheet"
    />
    <title>myVicRoads</title>
    <style>
      /* Critical shell: avoid white flash / bounce before CSS loads */
      html, body {
        margin: 0;
        height: 100%;
        background: #E8ECEE;
        overscroll-behavior: none;
      }
      #root {
        min-height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
